[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-gate"
version = "0.1.0"
description = "Fail-closed frontier state for agent capabilities, bound to verifier decisions"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]
